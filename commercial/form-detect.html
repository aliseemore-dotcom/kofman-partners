<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>K+P Commercial — enquiry form (Netlify form detection)</title>
</head>
<body>
<!-- Static copy of the enquiry form on /commercial/ so Netlify Forms can detect it at deploy time.
     The visible form is rendered by JS in index.html and posts to "/" with form-name=commercial-enquiry. -->
<form name="commercial-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="name">
  <input name="company">
  <input name="contact">
  <input name="sector">
  <input name="markets">
  <input name="stage">
  <textarea name="message"></textarea>
</form>
</body>
</html>
